{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voting System</title>
    <link rel="stylesheet" href="{% static "admin.css" %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body style="background-image: url(https://images.unsplash.com/photo-1665652475985-37e285aeff53?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MTJ8fGRhcmslMjBibHVlJTIwZ3JhZGllbnR8ZW58MHx8MHx8fDA%3D); background-size: cover;">

    <!-- <img src="./pexels-james-lee-932763-4723038.jpg" alt=""> -->
    
    <!-- <h1>This is Admin page</h1> -->
    <div style="background-color: rgb(128, 0, 21); width: 470px; padding: 2rem; margin-left: 25rem; border: 2px solid rgb(151, 151, 151); border-radius: 10px; margin-top: 3rem;" >

        <div class="input-group mb-3" style="width: 400px; " >
            <span class="input-group-text" id="inputGroup-sizing-default" style="background-color: rgb(155, 255, 248); width: 8rem;">Party Name</span>
            <input type="text" class="form-control" aria-label="Sizing example input" aria-describedby="inputGroup-sizing-default">
        </div>

        <div class="input-group mb-3" style="width: 400px;" >
            <span class="input-group-text" id="inputGroup-sizing-default" style="background-color: rgb(155, 255, 248); width: 8rem;">Symbol Name</span>
            <input type="text" class="form-control" aria-label="Sizing example input" aria-describedby="inputGroup-sizing-default">
        </div>

        <div class="input-group mb-3" style="width: 400px;" >
            <span class="input-group-text" id="inputGroup-sizing-default" style="background-color: rgb(155, 255, 248); width: 8rem;">Candidate</span>
            <input type="text" class="form-control" aria-label="Sizing example input" aria-describedby="inputGroup-sizing-default">
        </div>

        <button type="button" class="btn btn-warning btn-sm" style="display:block; margin:auto;">Submit</button>

    </div>

    <div style="display: flex; gap: 5rem; justify-content: center; margin-top: 5rem; width: 70vw; margin-left: 15vw; margin-right: 15vw;" class="p-3 mb-2 bg-warning-subtle text-warning-emphasis">
        <button type="button" class="btn btn-primary">Candidate List</button>
        <button type="button" class="btn btn-secondary">Voter's List</button>
        <button type="button" class="btn btn-success">Add Voter</button>
        <button type="button" class="btn btn-danger">Result</button>
    </div>


    <script></script>
</body>
</html>
